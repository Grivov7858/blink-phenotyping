name: Build macOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          brew install cmake

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download dlib shape predictor model
        run: |
          curl -L -o shape_predictor_68_face_landmarks.dat.bz2 \
            http://dlib.net/files/shape_predictor_68_face_landmarks.dat.bz2
          bunzip2 shape_predictor_68_face_landmarks.dat.bz2

      - name: Build app
        run: |
          pyinstaller \
            --name "Blink Phenotyping" \
            --onedir \
            --windowed \
            --add-data "templates:templates" \
            --add-data "static:static" \
            --add-data "shape_predictor_68_face_landmarks.dat:." \
            --hidden-import dlib \
            --hidden-import sklearn \
            --hidden-import sklearn.linear_model \
            --hidden-import sklearn.metrics \
            --hidden-import sklearn.model_selection \
            --hidden-import sklearn.utils._typedefs \
            --hidden-import sklearn.utils._heap \
            --hidden-import sklearn.utils._sorting \
            --hidden-import sklearn.utils._vector_sentinel \
            --collect-data sklearn \
            app.py

      - name: Create ZIP
        run: |
          cd dist
          zip -r "../Blink-Phenotyping-macOS.zip" "Blink Phenotyping.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blink-Phenotyping-macOS
          path: Blink-Phenotyping-macOS.zip
